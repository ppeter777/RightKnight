version: '3.8'
services:
  db:
    image: postgres:16-alpine # Используем свежую 16 версию
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myapp_db
    shm_size: 1gb # Увеличиваем разделяемую память для тяжелых запросов
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB

  app:
    build: .
    container_name: spring_app
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/myapp_db
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
      # Оптимизация JVM под 8ГБ: отдаем приложению 4ГБ
      JAVA_OPTS: "-Xmx4g -Xms4g"
    depends_on:
      - db

