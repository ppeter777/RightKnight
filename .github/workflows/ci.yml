name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rightknight_test
          POSTGRES_PASSWORD: rightknight_test
          POSTGRES_DB: rightknight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rightknight_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RIGHTKNIGHT_TEST_PG_URL: jdbc:postgresql://localhost:5432/rightknight_test
      RIGHTKNIGHT_TEST_PG_USER: rightknight_test
      RIGHTKNIGHT_TEST_PG_PASSWORD: rightknight_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build application
        run: ./gradlew build --no-daemon
